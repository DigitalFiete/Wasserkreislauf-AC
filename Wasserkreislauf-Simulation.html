<h1>Wasserkreislauf &amp; Wechselstrom</h1>
<p class="subtitle">Höhendifferenz ≙ Spannung · Wasserstrom ≙ Stromstärke · Bremse ≙ Widerstand</p>

<div class="sim-wrapper" id="simWrap">
  <canvas id="c"></canvas>
  <div class="hint" id="hint">Reservoire nach oben / unten ziehen</div>
</div>

<div class="controls">
  <div class="ctrl-group">
    <div class="ctrl-label">Widerstand (Bremse am Rad)</div>
    <div class="slider-row">
      <span style="font-size:.78rem">leicht</span>
      <input type="range" id="resistance" min="1" max="10" step="0.5" value="3">
      <span style="font-size:.78rem">schwer</span>
      <span class="slider-val" id="resVal">3</span>
    </div>
  </div>

  <div class="ctrl-group">
    <label class="check-row">
      <input type="checkbox" id="acMode">
      <span>Wechselstrom-Modus (AC)</span>
    </label>
    <div class="freq-row" id="freqRow">
      <label>Frequenz:</label>
      <input type="range" id="freq" min="0.1" max="2" step="0.1" value="0.5" style="flex:1">
      <span class="slider-val" id="freqVal">0.5 Hz</span>
    </div>
  </div>

  <div class="ctrl-group">
    <div class="ctrl-label">Tankgröße (Kapazität)</div>
    <div class="slider-row">
      <span style="font-size:.78rem">klein</span>
      <input type="range" id="tankCap" min="0" max="3" step="0.1" value="1">
      <span style="font-size:.78rem">groß</span>
      <span class="slider-val" id="capVal">1×</span>
    </div>
  </div>

  <div class="ctrl-group">
    <label class="check-row">
      <input type="checkbox" id="pumpMode">
      <span>⚡ Pumpe (Steckdose)</span>
    </label>
    <label class="check-row">
      <input type="checkbox" id="showParticles" checked>
      <span>Wasserpartikel anzeigen</span>
    </label>
    <label class="check-row">
      <input type="checkbox" id="showCircuit">
      <span>Schaltbild einblenden</span>
    </label>
    <label class="check-row">
      <input type="checkbox" id="showValues">
      <span>Zahlenwerte anzeigen</span>
    </label>
  </div>

  <div class="ctrl-group full" style="display:flex;align-items:center;justify-content:center">
    <button class="btn-reset" id="resetBtn">↺ Zurücksetzen</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// State & constants
// ═══════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('simWrap');

const CW = 820, CH = 680;
canvas.width = CW; canvas.height = CH;

// Tank geometry
const TANK_W = 55, TANK_H = 130, TANK_WALL = 4;
const PIPE_R = 12;
const WHEEL_R = 32;

// Circuit rectangle layout (pipes mirror the Schaltbild)
const CIRCUIT_LEFT = 200;
const CIRCUIT_RIGHT = 620;
const CIRCUIT_TOP = 280;
const CIRCUIT_BOTTOM = 580;

// Source dots (tanks connect directly here)
const DOT_GAP = 34;
const LEFT_DOT_X = CW / 2 - DOT_GAP;
const RIGHT_DOT_X = CW / 2 + DOT_GAP;

// Wheel at bottom center
const WHEEL_CX = CW / 2;
const WHEEL_CY = CIRCUIT_BOTTOM;

// Tank X positions (centered directly above source dots)
const LEFT_X = LEFT_DOT_X - TANK_W / 2;
const RIGHT_X = RIGHT_DOT_X - TANK_W / 2;
const LEFT_PIPE_X = LEFT_DOT_X;
const RIGHT_PIPE_X = RIGHT_DOT_X;

const MIN_TANK_Y = 15;
const MAX_TANK_Y = CIRCUIT_TOP - TANK_H - 8;

// Physics
const MAX_WATER = 1;
const FLOW_K = 0.0002;
const HOUSING_THICK = 5;
const HOUSING_R = WHEEL_R + HOUSING_THICK;
const TURBINE_OFFSET_Y = 10;

const state = {
  leftY: 40,
  rightY: 105,
  leftWater: 0.5,
  rightWater: 0.5,
  wheelAngle: 0,
  wheelSpeed: 0,
  resistance: 3,
  acMode: false,
  acFreq: 0.5,
  acPhase: 0,
  showParticles: true,
  showCircuit: false,
  showValues: false,
  dragging: null,
  dragOffsetY: 0,
  particles: [],
  time: 0,
  flowRate: 0,
  tankCapacity: 1,
  pumpActive: false,
  hintVisible: true
};

// ═══════════════════════════════════════════════════
// CSS-aware colors
// ═══════════════════════════════════════════════════
function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let colors = {};
function refreshColors() {
  colors = {
    bg: css('--surface') || '#fff',
    text: css('--text') || '#1e2a3a',
    textMuted: css('--text-muted') || '#6b7d8f',
    water: css('--water') || '#3d8ef0',
    waterDeep: css('--water-deep') || '#2563a0',
    waterLight: css('--water-light') || '#a8d0ff',
    pipe: css('--pipe') || '#9eaab8',
    pipeInner: css('--pipe-inner') || '#c8d0da',
    tankWall: css('--tank-wall') || '#6e7a88',
    tankInner: css('--tank-inner') || '#dfe4ea',
    wheelFrame: css('--wheel-frame') || '#4a5568',
    wheelBlade: css('--wheel-blade') || '#c8983a',
    wheelBladeHi: css('--wheel-blade-hi') || '#ddb04e',
    brakeOff: css('--brake-off') || '#78a080',
    brakeOn: css('--brake-on') || '#d64545',
    accent: css('--accent') || '#3b82f6',
    accentMuted: css('--accent-muted') || '#93b8f0',
    surfaceAlt: css('--surface-alt') || '#e8eef4',
    flexTube: css('--flex-tube') || '#b0bcc8',
    flexTubeInner: css('--flex-tube-inner') || '#d5dce5',
  };
}
refreshColors();
const mql = window.matchMedia('(prefers-color-scheme: dark)');
mql.addEventListener('change', refreshColors);
new MutationObserver(refreshColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ═══════════════════════════════════════════════════
// Particle system
// ═══════════════════════════════════════════════════
function initParticles(n = 40) {
  state.particles = [];
  for (let i = 0; i < n; i++) {
    state.particles.push({ t: Math.random() });
  }
}
initParticles();

function getPipePathPoint(t, leftBottom, rightBottom) {
  // Arc through turbine housing: particles follow the inner curvature
  const arcCX = WHEEL_CX;
  const arcCY = WHEEL_CY - TURBINE_OFFSET_Y; // wheel center (shifted up)
  const arcR = WHEEL_R * 0.5; // half radius — particles run midway through blades
  // Entry/exit x positions on the housing circle at y = CIRCUIT_BOTTOM
  const dy = CIRCUIT_BOTTOM - arcCY;
  const dx = Math.sqrt(Math.max(0, arcR * arcR - dy * dy));
  const arcEntryX = arcCX - dx;
  const arcExitX = arcCX + dx;
  // Angles for the arc (going clockwise through bottom = positive y)
  const arcStartAngle = Math.atan2(CIRCUIT_BOTTOM - arcCY, arcEntryX - arcCX);
  const arcEndAngle = Math.atan2(CIRCUIT_BOTTOM - arcCY, arcExitX - arcCX);
  // Arc length (going clockwise from startAngle to endAngle through bottom)
  // startAngle ~ positive (slightly > pi/2), endAngle ~ small positive (slightly < pi/2)
  // We go CW: from startAngle down through PI to endAngle
  let arcSweep = arcStartAngle - arcEndAngle;
  if (arcSweep < 0) arcSweep += Math.PI * 2;
  const arcLen = arcR * arcSweep;

  const segments = [
    // Left flex tube (tank to circuit top)
    { type: 'line', x0: LEFT_DOT_X, y0: leftBottom, x1: LEFT_DOT_X, y1: CIRCUIT_TOP },
    // Top horizontal left (dot to left corner)
    { type: 'line', x0: LEFT_DOT_X, y0: CIRCUIT_TOP, x1: CIRCUIT_LEFT, y1: CIRCUIT_TOP },
    // Left vertical side (corner down to bottom)
    { type: 'line', x0: CIRCUIT_LEFT, y0: CIRCUIT_TOP, x1: CIRCUIT_LEFT, y1: CIRCUIT_BOTTOM },
    // Bottom left horizontal (to turbine arc entry)
    { type: 'line', x0: CIRCUIT_LEFT, y0: CIRCUIT_BOTTOM, x1: arcEntryX, y1: CIRCUIT_BOTTOM },
    // Arc through turbine chamber (CW through bottom)
    { type: 'arc', cx: arcCX, cy: arcCY, r: arcR, startAngle: arcStartAngle, sweep: -arcSweep, len: arcLen },
    // Bottom right horizontal (from turbine arc exit)
    { type: 'line', x0: arcExitX, y0: CIRCUIT_BOTTOM, x1: CIRCUIT_RIGHT, y1: CIRCUIT_BOTTOM },
    // Right vertical side (bottom up to corner)
    { type: 'line', x0: CIRCUIT_RIGHT, y0: CIRCUIT_BOTTOM, x1: CIRCUIT_RIGHT, y1: CIRCUIT_TOP },
    // Top horizontal right (right corner to dot)
    { type: 'line', x0: CIRCUIT_RIGHT, y0: CIRCUIT_TOP, x1: RIGHT_DOT_X, y1: CIRCUIT_TOP },
    // Right flex tube (circuit top up to tank)
    { type: 'line', x0: RIGHT_DOT_X, y0: CIRCUIT_TOP, x1: RIGHT_DOT_X, y1: rightBottom },
  ];

  const lengths = segments.map(s => s.type === 'arc' ? s.len : Math.hypot(s.x1 - s.x0, s.y1 - s.y0));
  const total = lengths.reduce((a, b) => a + b, 0);
  let dist = t * total;
  for (let i = 0; i < segments.length; i++) {
    if (dist <= lengths[i]) {
      const seg = segments[i];
      if (seg.type === 'arc') {
        const frac = lengths[i] > 0 ? dist / lengths[i] : 0;
        const angle = seg.startAngle + seg.sweep * frac;
        return { x: seg.cx + Math.cos(angle) * seg.r, y: seg.cy + Math.sin(angle) * seg.r };
      } else {
        const frac = lengths[i] > 0 ? dist / lengths[i] : 0;
        return { x: seg.x0 + (seg.x1 - seg.x0) * frac, y: seg.y0 + (seg.y1 - seg.y0) * frac };
      }
    }
    dist -= lengths[i];
  }
  const last = segments[segments.length - 1];
  return { x: last.x1, y: last.y1 };
}

// ═══════════════════════════════════════════════════
// Physics
// ═══════════════════════════════════════════════════
function getWaterSurfaceY(tankY, waterFrac) {
  const innerH = TANK_H - TANK_WALL * 2;
  return tankY + TANK_WALL + innerH * (1 - waterFrac);
}

function getPhysicalHeight(tankY, waterFrac) {
  return CH - getWaterSurfaceY(tankY, waterFrac);
}

function update(dt) {
  if (state.acMode) {
    state.acPhase += dt * state.acFreq * Math.PI * 2;
    const center = (MIN_TANK_Y + MAX_TANK_Y) / 2;
    const amp = (MAX_TANK_Y - MIN_TANK_Y) * 0.38;
    state.leftY = center - amp * Math.sin(state.acPhase);
    state.rightY = center + amp * Math.sin(state.acPhase);
  }

  const hL = getPhysicalHeight(state.leftY, state.leftWater);
  const hR = getPhysicalHeight(state.rightY, state.rightWater);
  const dh = hL - hR;

  const R = state.resistance;
  let Q = FLOW_K * dh / R;

  if (Q > 0) {
    Q = Math.min(Q, state.leftWater * 0.5, (1 - state.rightWater) * 0.5);
    if (state.leftWater <= 0.001) Q = 0;
  } else {
    Q = Math.max(Q, -state.rightWater * 0.5, -(1 - state.leftWater) * 0.5);
    if (state.rightWater <= 0.001) Q = 0;
  }

  if (!state.pumpActive) {
    // Battery mode: water levels change, capacity affects drain speed
    const C = state.tankCapacity;
    state.leftWater = Math.max(0, Math.min(1, state.leftWater - Q / C));
    state.rightWater = Math.max(0, Math.min(1, state.rightWater + Q / C));

    const total = state.leftWater + state.rightWater;
    if (total > 0.001) {
      state.leftWater *= MAX_WATER / total;
      state.rightWater *= MAX_WATER / total;
    }
  }
  // Pump mode: water levels stay constant (pump recirculates)

  state.flowRate = Q;

  const targetSpeed = -Q * 150 / R;
  const smoothFactor = 1 - Math.pow(0.92, dt * 60);
  state.wheelSpeed += (targetSpeed - state.wheelSpeed) * smoothFactor;
  state.wheelAngle += state.wheelSpeed;

  if (state.showParticles) {
    const speed = Q * 0.4;
    for (const p of state.particles) {
      p.t += speed;
      if (p.t > 1) p.t -= 1;
      if (p.t < 0) p.t += 1;
    }
  }

  state.time += dt;
}

// ═══════════════════════════════════════════════════
// Drawing helpers
// ═══════════════════════════════════════════════════
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ═══════════════════════════════════════════════════
// Draw
// ═══════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0, 0, CW, CH);

  const leftBottom = state.leftY + TANK_H;
  const rightBottom = state.rightY + TANK_H;

  drawPipes(leftBottom, rightBottom);
  drawPipeWater(leftBottom, rightBottom);
  drawSourceDots();
  drawTank(LEFT_X, state.leftY, state.leftWater, 'L');
  drawTank(RIGHT_X, state.rightY, state.rightWater, 'R');
  drawWheel();
  if (state.showParticles) drawParticles(leftBottom, rightBottom);
  drawHeightAnnotation();
  drawFlowArrow();
  drawLabels();
  drawPumpSystem();
  if (state.showCircuit) drawCircuit();
  if (state.showValues) drawValues();
}

function drawPipes(lb, rb) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Helper: draw one segment outer + inner (for flex tubes only)
  function pipeSegment(x0, y0, x1, y1, outer, inner) {
    ctx.lineWidth = PIPE_R * 2;
    ctx.strokeStyle = outer;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.lineWidth = PIPE_R * 2 - 6;
    ctx.strokeStyle = inner;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // Flex tubes (from tank bottoms straight down to circuit top at dot positions)
  pipeSegment(LEFT_DOT_X, lb - TANK_WALL, LEFT_DOT_X, CIRCUIT_TOP, colors.flexTube, colors.flexTubeInner);
  pipeSegment(RIGHT_DOT_X, rb - TANK_WALL, RIGHT_DOT_X, CIRCUIT_TOP, colors.flexTube, colors.flexTubeInner);

  // Dashed flex pattern on tubes
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 1;
  ctx.strokeStyle = colors.pipe;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(LEFT_DOT_X - PIPE_R + 3, lb - TANK_WALL);
  ctx.lineTo(LEFT_DOT_X - PIPE_R + 3, CIRCUIT_TOP);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(LEFT_DOT_X + PIPE_R - 3, lb - TANK_WALL);
  ctx.lineTo(LEFT_DOT_X + PIPE_R - 3, CIRCUIT_TOP);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(RIGHT_DOT_X - PIPE_R + 3, rb - TANK_WALL);
  ctx.lineTo(RIGHT_DOT_X - PIPE_R + 3, CIRCUIT_TOP);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(RIGHT_DOT_X + PIPE_R - 3, rb - TANK_WALL);
  ctx.lineTo(RIGHT_DOT_X + PIPE_R - 3, CIRCUIT_TOP);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // Rigid circuit pipes as ONE continuous path (no corner overlaps)
  // Path: left dot → left corner → bottom-left → bottom-right → right corner → right dot
  function rigidCircuitPath() {
    ctx.beginPath();
    ctx.moveTo(LEFT_DOT_X, CIRCUIT_TOP);
    ctx.lineTo(CIRCUIT_LEFT, CIRCUIT_TOP);
    ctx.lineTo(CIRCUIT_LEFT, CIRCUIT_BOTTOM);
    ctx.lineTo(CIRCUIT_RIGHT, CIRCUIT_BOTTOM);
    ctx.lineTo(CIRCUIT_RIGHT, CIRCUIT_TOP);
    ctx.lineTo(RIGHT_DOT_X, CIRCUIT_TOP);
  }

  // Outer pipe wall
  ctx.lineWidth = PIPE_R * 2;
  ctx.strokeStyle = colors.pipe;
  rigidCircuitPath();
  ctx.stroke();

  // Inner pipe fill
  ctx.lineWidth = PIPE_R * 2 - 6;
  ctx.strokeStyle = colors.pipeInner;
  rigidCircuitPath();
  ctx.stroke();
}

function drawPipeWater(lb, rb) {
  const hasWater = (state.leftWater > 0.005 || state.rightWater > 0.005);
  if (!hasWater) return;

  ctx.lineWidth = PIPE_R * 2 - 8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = colors.water;
  ctx.globalAlpha = 0.7;

  const leftSurfY = getWaterSurfaceY(state.leftY, state.leftWater);
  const rightSurfY = getWaterSurfaceY(state.rightY, state.rightWater);

  // Draw the rigid circuit loop as ONE continuous path to avoid overlap at corners
  const leftHasWater = state.leftWater > 0.005;
  const rightHasWater = state.rightWater > 0.005;

  // Left flex tube (separate path — flex tubes don't join rigid pipes at an angle)
  if (leftHasWater) {
    const startY = Math.max(leftSurfY, state.leftY + TANK_WALL);
    ctx.beginPath();
    ctx.moveTo(LEFT_DOT_X, Math.min(lb - TANK_WALL, startY + PIPE_R));
    ctx.lineTo(LEFT_DOT_X, CIRCUIT_TOP);
    ctx.stroke();
  }

  // Right flex tube (separate path)
  if (rightHasWater) {
    const startY = Math.max(rightSurfY, state.rightY + TANK_WALL);
    ctx.beginPath();
    ctx.moveTo(RIGHT_DOT_X, CIRCUIT_TOP);
    ctx.lineTo(RIGHT_DOT_X, Math.min(rb - TANK_WALL, startY + PIPE_R));
    ctx.stroke();
  }

  // Rigid circuit: single continuous path (lineJoin handles corners cleanly)
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (leftHasWater) {
    ctx.moveTo(LEFT_DOT_X, CIRCUIT_TOP);
    ctx.lineTo(CIRCUIT_LEFT, CIRCUIT_TOP);
    ctx.lineTo(CIRCUIT_LEFT, CIRCUIT_BOTTOM);
    ctx.lineTo(CIRCUIT_RIGHT, CIRCUIT_BOTTOM);
    ctx.lineTo(CIRCUIT_RIGHT, CIRCUIT_TOP);
    ctx.lineTo(RIGHT_DOT_X, CIRCUIT_TOP);
  } else if (rightHasWater) {
    ctx.moveTo(CIRCUIT_LEFT, CIRCUIT_BOTTOM);
    ctx.lineTo(CIRCUIT_RIGHT, CIRCUIT_BOTTOM);
    ctx.lineTo(CIRCUIT_RIGHT, CIRCUIT_TOP);
    ctx.lineTo(RIGHT_DOT_X, CIRCUIT_TOP);
  } else {
    ctx.moveTo(CIRCUIT_LEFT, CIRCUIT_BOTTOM);
    ctx.lineTo(CIRCUIT_RIGHT, CIRCUIT_BOTTOM);
  }
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function drawSourceDots() {
  // Two source dots at top center of circuit
  ctx.fillStyle = colors.accent;

  ctx.beginPath();
  ctx.arc(LEFT_DOT_X, CIRCUIT_TOP, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(RIGHT_DOT_X, CIRCUIT_TOP, 5, 0, Math.PI * 2);
  ctx.fill();

  // Labels
}

function drawTank(x, y, waterFrac, label) {
  const w = TANK_W, h = TANK_H, wall = TANK_WALL;
  const innerW = w - wall * 2;
  const innerH = h - wall * 2;

  // Tank wall
  roundRect(x, y, w, h, 6);
  ctx.fillStyle = colors.tankWall;
  ctx.fill();

  // Inner area
  ctx.fillStyle = colors.tankInner;
  ctx.fillRect(x + wall, y + wall, innerW, innerH);

  // Water fill
  if (waterFrac > 0.002) {
    const waterH = innerH * waterFrac;
    const waterY = y + wall + innerH - waterH;

    const grad = ctx.createLinearGradient(0, waterY, 0, waterY + waterH);
    grad.addColorStop(0, colors.water);
    grad.addColorStop(1, colors.waterDeep);
    ctx.fillStyle = grad;
    ctx.fillRect(x + wall, waterY, innerW, waterH);

    // Water surface highlight
    ctx.fillStyle = colors.waterLight;
    ctx.globalAlpha = 0.4;
    ctx.fillRect(x + wall, waterY, innerW, 3);
    ctx.globalAlpha = 1;
  }

  // Open top indicator
  ctx.fillStyle = colors.tankInner;
  ctx.fillRect(x + w / 2 - 10, y - 1, 20, wall + 2);

  // Drag grip
  ctx.strokeStyle = colors.textMuted;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 3; i++) {
    const gy = y + 14 + i * 5;
    ctx.beginPath();
    ctx.moveTo(x + w / 2 - 10, gy);
    ctx.lineTo(x + w / 2 + 10, gy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Label
}

function drawWheel() {
  const cx = WHEEL_CX;
  const cy = WHEEL_CY - TURBINE_OFFSET_Y; // wheel center shifted up
  const r = WHEEL_R;
  const outerR = HOUSING_R;
  const hubR = 8;
  const numBlades = 8;
  const openY = CIRCUIT_BOTTOM; // pipe height (below wheel center)
  const channelH = PIPE_R * 2 - 8;

  // === Housing with offset opening channels ===
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
  ctx.clip();
  // Housing wall (fills within clipped circle)
  ctx.fillStyle = colors.wheelFrame;
  ctx.fillRect(cx - outerR, cy - outerR, outerR * 2, outerR * 2);
  // Channel cut at pipe height (looks like open passage, not a block)
  ctx.fillStyle = colors.tankInner;
  ctx.fillRect(cx - outerR, openY - channelH / 2, outerR * 2, channelH);
  ctx.restore();

  // Inner chamber
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = colors.tankInner;
  ctx.fill();

  // Water inside chamber and channels
  if (state.leftWater > 0.005 || state.rightWater > 0.005) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
    // Include channel areas in clip for water fill
    ctx.rect(cx - outerR, openY - channelH / 2 + 1, outerR - r + 1, channelH - 2);
    ctx.rect(cx + r - 1, openY - channelH / 2 + 1, outerR - r + 1, channelH - 2);
    ctx.clip();
    ctx.fillStyle = colors.water;
    ctx.globalAlpha = 0.35;
    ctx.fillRect(cx - outerR, cy - r, outerR * 2, r * 2 + TURBINE_OFFSET_Y + channelH);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // === Blades (extend from hub to near housing wall) ===
  for (let i = 0; i < numBlades; i++) {
    const a = state.wheelAngle + (i * Math.PI * 2) / numBlades;
    const endR = r - 2;

    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * hubR, cy + Math.sin(a) * hubR);
    ctx.lineTo(cx + Math.cos(a) * endR, cy + Math.sin(a) * endR);
    ctx.lineWidth = 5;
    ctx.strokeStyle = colors.wheelBlade;
    ctx.lineCap = 'butt';
    ctx.stroke();

    // Highlight edge
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = colors.wheelBladeHi;
    ctx.stroke();
  }

  // === Hub ===
  ctx.beginPath();
  ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
  ctx.fillStyle = colors.wheelFrame;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = colors.tankInner;
  ctx.fill();

  // === Shaft bearing at top of housing ===
  ctx.beginPath();
  ctx.arc(cx, cy - outerR, 5, 0, Math.PI * 2);
  ctx.fillStyle = colors.wheelFrame;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy - outerR, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = colors.tankInner;
  ctx.fill();

  // === Shaft (from housing top upward) ===
  const shaftTop = cy - outerR - 18;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  ctx.lineTo(cx, shaftTop);
  ctx.lineWidth = 4;
  ctx.strokeStyle = colors.wheelFrame;
  ctx.lineCap = 'round';
  ctx.stroke();

  // === Brake pads on shaft ===
  const brakeStrength = (state.resistance - 1) / 9;
  const brakeColor = lerpColor(colors.brakeOff, colors.brakeOn, brakeStrength);
  const brakeY = cy - outerR - 8;
  const padW = 4 + brakeStrength * 4;
  const padH = 13;

  ctx.fillStyle = brakeColor;
  roundRect(cx - padW - 2, brakeY - padH / 2, padW, padH, 2);
  ctx.fill();
  roundRect(cx + 2, brakeY - padH / 2, padW, padH, 2);
  ctx.fill();

  // Brake label
  ctx.fillStyle = brakeColor;
  ctx.font = '500 10px "DM Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Bremse', cx, brakeY - padH / 2 - 6);
}

function drawParticles(lb, rb) {
  for (const p of state.particles) {
    const pos = getPipePathPoint(p.t, lb - TANK_WALL, rb - TANK_WALL);
    // Check if particle is inside turbine housing region
    const turbCY = WHEEL_CY - TURBINE_OFFSET_Y;
    const distFromWheel = Math.hypot(pos.x - WHEEL_CX, pos.y - turbCY);
    const inTurbine = distFromWheel < HOUSING_R + 2;
    ctx.fillStyle = inTurbine ? '#ffffff' : colors.waterLight;
    ctx.globalAlpha = inTurbine ? 0.95 : 0.8;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, inTurbine ? 3.5 : 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHeightAnnotation() {
  const leftSurfY = getWaterSurfaceY(state.leftY, state.leftWater);
  const rightSurfY = getWaterSurfaceY(state.rightY, state.rightWater);

  if (Math.abs(leftSurfY - rightSurfY) < 5) return;

  const topY = Math.min(leftSurfY, rightSurfY);
  const botY = Math.max(leftSurfY, rightSurfY);
  // Place annotation to the right of both tanks
  const annotX = RIGHT_X + TANK_W + 20;

  // Dashed lines from water surfaces
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = colors.textMuted;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.6;

  ctx.beginPath();
  ctx.moveTo(leftSurfY < rightSurfY ? LEFT_X + TANK_W + 5 : RIGHT_X + TANK_W + 5, topY);
  ctx.lineTo(annotX - 5, topY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(leftSurfY > rightSurfY ? LEFT_X + TANK_W + 5 : RIGHT_X + TANK_W + 5, botY);
  ctx.lineTo(annotX - 5, botY);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // Vertical double arrow
  ctx.strokeStyle = colors.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(annotX, topY + 6);
  ctx.lineTo(annotX, botY - 6);
  ctx.stroke();

  drawArrowhead(annotX, topY + 6, -Math.PI / 2, colors.accent);
  drawArrowhead(annotX, botY - 6, Math.PI / 2, colors.accent);

  // "Δh" label
  ctx.fillStyle = colors.accent;
  ctx.font = 'italic 600 16px "DM Sans", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Δh', annotX + 8, (topY + botY) / 2 + 5);
}

function drawArrowhead(x, y, angle, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-5, -4);
  ctx.lineTo(-5, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFlowArrow() {
  if (Math.abs(state.flowRate) < 0.0001) return;

  const dir = state.flowRate > 0 ? 1 : -1;
  const strength = Math.min(Math.abs(state.flowRate) * 3200, 1);

  // Show flow direction on left vertical side
  const arrowX = CIRCUIT_LEFT - PIPE_R - 16;
  const arrowY = (CIRCUIT_TOP + CIRCUIT_BOTTOM) / 2;

  ctx.globalAlpha = 0.5 + strength * 0.5;
  ctx.fillStyle = colors.water;
  ctx.font = '500 12px "DM Sans", sans-serif';
  ctx.textAlign = 'center';

  ctx.save();
  ctx.translate(arrowX, arrowY);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(dir > 0 ? '← Wasserstrom' : 'Wasserstrom →', 0, 0);
  ctx.restore();

  ctx.globalAlpha = 1;
}

function drawLabels() {
  ctx.fillStyle = colors.textMuted;
  ctx.font = '500 11px "DM Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Turbine (Verbraucher)', WHEEL_CX, WHEEL_CY - TURBINE_OFFSET_Y + HOUSING_R + 16);

  if (state.acMode) {
    ctx.fillStyle = colors.accent;
    ctx.font = '600 11px "DM Sans", sans-serif';
    ctx.fillText('⚡ AC-Modus', CW / 2, 28);
  }
}

function drawPumpSystem() {
  if (!state.pumpActive) return;

  const leftHigher = state.leftY <= state.rightY;
  const srcY = leftHigher ? state.rightY : state.leftY;
  const dstY = leftHigher ? state.leftY : state.rightY;
  const dstDotX = leftHigher ? LEFT_DOT_X : RIGHT_DOT_X;

  // Route pump pipe on the outer side of the source (lower) tank
  const goRight = leftHigher;
  const exitX = goRight ? (RIGHT_X + TANK_W) : LEFT_X;
  const exitY = srcY + TANK_H - 25;
  const pipeX = goRight ? 700 : 120;
  const topY = 8;
  const entryX = dstDotX;
  const entryY = dstY + 5;

  // Pump on vertical section
  const pumpR = 16;
  const pumpCX = pipeX;
  const pumpCY = Math.max(topY + pumpR + 8, Math.min((topY + exitY) / 2, exitY - pumpR - 8));

  // Pipe segment helper
  function pPipe(x0, y0, x1, y1) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = PIPE_R * 2 - 4;
    ctx.strokeStyle = colors.pipe;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.lineWidth = PIPE_R * 2 - 10;
    ctx.strokeStyle = colors.pipeInner;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }

  // Water fill helper
  function pWater(x0, y0, x1, y1) {
    ctx.lineWidth = PIPE_R * 2 - 12;
    ctx.strokeStyle = colors.water;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }

  // Draw pump pipe segments
  pPipe(exitX, exitY, pipeX, exitY);
  pPipe(pipeX, exitY, pipeX, pumpCY + pumpR + 4);
  pPipe(pipeX, pumpCY - pumpR - 4, pipeX, topY);
  pPipe(pipeX, topY, entryX, topY);
  pPipe(entryX, topY, entryX, entryY);

  // Water in pump pipe
  ctx.globalAlpha = 0.5;
  pWater(exitX, exitY, pipeX, exitY);
  pWater(pipeX, exitY, pipeX, pumpCY + pumpR + 4);
  pWater(pipeX, pumpCY - pumpR - 4, pipeX, topY);
  pWater(pipeX, topY, entryX, topY);
  pWater(entryX, topY, entryX, entryY);
  ctx.globalAlpha = 1;

  // Water drops at pour point (splashing into tank)
  for (let i = 0; i < 5; i++) {
    const phase = (state.time * 4.5 + i * 0.2) % 1;
    const dropY = entryY + phase * 20;
    const spread = Math.sin(phase * Math.PI) * 6;
    const dropAlpha = (1 - phase) * 0.85;
    ctx.globalAlpha = dropAlpha;
    ctx.fillStyle = colors.water;
    ctx.beginPath();
    ctx.ellipse(entryX + (i - 2) * spread * 0.3, dropY, 2, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Pump housing
  ctx.beginPath();
  ctx.arc(pumpCX, pumpCY, pumpR + 3, 0, Math.PI * 2);
  ctx.fillStyle = colors.wheelFrame;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pumpCX, pumpCY, pumpR, 0, Math.PI * 2);
  ctx.fillStyle = colors.tankInner;
  ctx.fill();

  // Water inside pump chamber
  ctx.beginPath();
  ctx.arc(pumpCX, pumpCY, pumpR - 1, 0, Math.PI * 2);
  ctx.fillStyle = colors.water;
  ctx.globalAlpha = 0.25;
  ctx.fill();
  ctx.globalAlpha = 1;

  // Curved blades (distinguishes pump from turbine's straight blades)
  const numBlades = 6;
  const bladeHub = 4;
  const pAngle = state.time * 5;
  for (let i = 0; i < numBlades; i++) {
    const a = pAngle + (i * Math.PI * 2) / numBlades;
    const sx = pumpCX + Math.cos(a) * bladeHub;
    const sy = pumpCY + Math.sin(a) * bladeHub;
    const ex = pumpCX + Math.cos(a) * (pumpR - 2);
    const ey = pumpCY + Math.sin(a) * (pumpR - 2);
    const perpX = -Math.sin(a) * pumpR * 0.35;
    const perpY = Math.cos(a) * pumpR * 0.35;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo((sx + ex) / 2 + perpX, (sy + ey) / 2 + perpY, ex, ey);
    ctx.lineWidth = 3;
    ctx.strokeStyle = colors.wheelBlade;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = colors.wheelBladeHi;
    ctx.stroke();
  }

  // Hub
  ctx.beginPath();
  ctx.arc(pumpCX, pumpCY, bladeHub, 0, Math.PI * 2);
  ctx.fillStyle = colors.wheelFrame;
  ctx.fill();

  // "Pumpe" label
  ctx.fillStyle = colors.accent;
  ctx.font = '500 10px "DM Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Pumpe', pumpCX, pumpCY + pumpR + 16);

  // Cable from pump to Steckdose
  const steckX = goRight ? pipeX + 60 : pipeX - 60;
  const steckY = pumpCY - 42;
  const cableExitX = goRight ? pumpCX + pumpR + 3 : pumpCX - pumpR - 3;

  ctx.beginPath();
  ctx.moveTo(cableExitX, pumpCY);
  ctx.quadraticCurveTo(steckX, pumpCY, steckX, steckY + 16);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = colors.textMuted;
  ctx.lineCap = 'round';
  ctx.setLineDash([]);
  ctx.stroke();

  // Steckdose (European Schuko outlet)
  const sw = 26, sh = 30;
  const sox = steckX - sw / 2, soy = steckY - sh / 2;

  // Outlet body
  roundRect(sox, soy, sw, sh, 4);
  ctx.fillStyle = colors.surfaceAlt;
  ctx.fill();
  ctx.strokeStyle = colors.wheelFrame;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Recessed circle
  ctx.beginPath();
  ctx.arc(steckX, steckY, 9, 0, Math.PI * 2);
  ctx.fillStyle = colors.tankInner;
  ctx.fill();
  ctx.strokeStyle = colors.pipe;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Two round pin holes
  ctx.fillStyle = colors.wheelFrame;
  ctx.beginPath();
  ctx.arc(steckX, steckY - 3.5, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(steckX, steckY + 3.5, 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Ground clips (Schutzkontakt)
  ctx.fillRect(steckX - 8, steckY - 1.5, 2, 3);
  ctx.fillRect(steckX + 6, steckY - 1.5, 2, 3);

  // "Steckdose" label
  ctx.fillStyle = colors.textMuted;
  ctx.font = '500 9px "DM Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚡ Steckdose', steckX, soy + sh + 12);
}

function drawCircuit() {
  // Position centered in the circuit rectangle
  const cx = (CIRCUIT_LEFT + CIRCUIT_RIGHT) / 2;
  const cy = (CIRCUIT_TOP + CIRCUIT_BOTTOM) / 2;
  const w = 175, h = 140;
  const ox = cx - w / 2;
  const oy = cy - h / 2;

  // Background
  roundRect(ox, oy, w, h, 8);
  ctx.fillStyle = colors.bg;
  ctx.globalAlpha = 0.92;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = colors.pipe;
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = colors.textMuted;
  ctx.font = '600 9px "DM Sans", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCHALTBILD', ox + 10, oy + 14);

  const scx = ox + w / 2;
  const topSY = oy + 38;
  const botSY = oy + h - 22;
  const halfW = 38;
  const dotG = 8;

  ctx.strokeStyle = colors.text;
  ctx.lineWidth = 1.5;

  // Left side wires
  ctx.beginPath();
  ctx.moveTo(scx - dotG, topSY);
  ctx.lineTo(scx - halfW, topSY);
  ctx.lineTo(scx - halfW, botSY);
  ctx.stroke();

  // Right side wires
  ctx.beginPath();
  ctx.moveTo(scx + dotG, topSY);
  ctx.lineTo(scx + halfW, topSY);
  ctx.lineTo(scx + halfW, botSY);
  ctx.stroke();

  // Bottom wire (left to lamp)
  ctx.beginPath();
  ctx.moveTo(scx - halfW, botSY);
  ctx.lineTo(scx - 10, botSY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(scx + 10, botSY);
  ctx.lineTo(scx + halfW, botSY);
  ctx.stroke();

  // Lamp symbol (circle with ×)
  ctx.beginPath();
  ctx.arc(scx, botSY, 10, 0, Math.PI * 2);
  ctx.strokeStyle = colors.text;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  const d = 6;
  ctx.beginPath();
  ctx.moveTo(scx - d, botSY - d);
  ctx.lineTo(scx + d, botSY + d);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(scx + d, botSY - d);
  ctx.lineTo(scx - d, botSY + d);
  ctx.stroke();

  // Source dots
  ctx.fillStyle = colors.accent;
  ctx.beginPath();
  ctx.arc(scx - dotG, topSY, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(scx + dotG, topSY, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Labels
  ctx.font = '500 10px "DM Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = colors.accent;
  ctx.fillText('U', scx, topSY - 10);

  ctx.fillStyle = colors.text;
  ctx.fillText('Lampe', scx, botSY + 22);

  // Current arrow
  const dir = state.flowRate > 0 ? 1 : (state.flowRate < 0 ? -1 : 0);
  if (dir !== 0) {
    ctx.fillStyle = colors.water;
    ctx.font = '500 10px "DM Sans", sans-serif';
    const arrowY = (topSY + botSY) / 2;
    ctx.fillText(dir > 0 ? 'I ↓' : 'I ↑', scx + halfW + 16, arrowY + 3);
  }
}

function drawValues() {
  const ox = 14, oy = 18;
  const w = 175, h = 82;

  roundRect(ox, oy, w, h, 8);
  ctx.fillStyle = colors.bg;
  ctx.globalAlpha = 0.92;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = colors.pipe;
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = colors.textMuted;
  ctx.font = '600 9px "DM Sans", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('MESSWERTE', ox + 10, oy + 14);

  const leftH = getPhysicalHeight(state.leftY, state.leftWater);
  const rightH = getPhysicalHeight(state.rightY, state.rightWater);
  const dh = leftH - rightH;
  const voltage = (dh / 100).toFixed(1);
  const current = (state.flowRate * 1000).toFixed(1);

  ctx.font = '500 12px "JetBrains Mono", monospace';
  ctx.textAlign = 'left';

  ctx.fillStyle = colors.accent;
  ctx.fillText(`Δh ≙ U = ${voltage} V`, ox + 10, oy + 34);

  ctx.fillStyle = colors.water;
  ctx.fillText(`Q  ≙ I = ${current} mA`, ox + 10, oy + 52);

  ctx.fillStyle = colors.text;
  ctx.fillText(`R       = ${state.resistance.toFixed(1)} Ω`, ox + 10, oy + 70);
}

// ═══════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════
function lerpColor(a, b, t) {
  const parseHex = (c) => {
    c = c.replace('#', '');
    return [parseInt(c.slice(0,2),16), parseInt(c.slice(2,4),16), parseInt(c.slice(4,6),16)];
  };
  const [r1,g1,b1] = parseHex(a);
  const [r2,g2,b2] = parseHex(b);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const bl = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${bl})`;
}

// ═══════════════════════════════════════════════════
// Interaction
// ═══════════════════════════════════════════════════
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function hitTank(px, py, tankX, tankY) {
  return px >= tankX && px <= tankX + TANK_W && py >= tankY && py <= tankY + TANK_H;
}

function onPointerDown(e) {
  if (state.acMode) return;
  const pos = getCanvasPos(e);
  if (hitTank(pos.x, pos.y, LEFT_X, state.leftY)) {
    state.dragging = 'left';
    state.dragOffsetY = pos.y - state.leftY;
    hideHint();
  } else if (hitTank(pos.x, pos.y, RIGHT_X, state.rightY)) {
    state.dragging = 'right';
    state.dragOffsetY = pos.y - state.rightY;
    hideHint();
  }
}

function onPointerMove(e) {
  if (!state.dragging) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  let newY = pos.y - state.dragOffsetY;
  newY = Math.max(MIN_TANK_Y, Math.min(MAX_TANK_Y, newY));

  if (state.dragging === 'left') state.leftY = newY;
  else state.rightY = newY;
}

function onPointerUp() {
  state.dragging = null;
}

wrap.addEventListener('mousemove', (e) => {
  if (state.acMode) { wrap.style.cursor = 'default'; return; }
  const pos = getCanvasPos(e);
  if (hitTank(pos.x, pos.y, LEFT_X, state.leftY) || hitTank(pos.x, pos.y, RIGHT_X, state.rightY)) {
    wrap.style.cursor = 'grab';
  } else {
    wrap.style.cursor = 'default';
  }
});

wrap.addEventListener('mousedown', onPointerDown);
wrap.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('touchmove', onPointerMove, { passive: false });
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchend', onPointerUp);

function hideHint() {
  if (state.hintVisible) {
    state.hintVisible = false;
    document.getElementById('hint').style.opacity = '0';
  }
}

// ═══════════════════════════════════════════════════
// Controls
// ═══════════════════════════════════════════════════
const resistanceEl = document.getElementById('resistance');
const resValEl = document.getElementById('resVal');
const acModeEl = document.getElementById('acMode');
const freqEl = document.getElementById('freq');
const freqValEl = document.getElementById('freqVal');
const freqRowEl = document.getElementById('freqRow');
const showParticlesEl = document.getElementById('showParticles');
const showCircuitEl = document.getElementById('showCircuit');
const showValuesEl = document.getElementById('showValues');
const resetBtn = document.getElementById('resetBtn');
const tankCapEl = document.getElementById('tankCap');
const capValEl = document.getElementById('capVal');
const pumpModeEl = document.getElementById('pumpMode');

resistanceEl.addEventListener('input', () => {
  state.resistance = parseFloat(resistanceEl.value);
  resValEl.textContent = state.resistance.toFixed(1);
});

acModeEl.addEventListener('change', () => {
  state.acMode = acModeEl.checked;
  freqRowEl.classList.toggle('active', state.acMode);
  if (state.acMode) {
    state.acPhase = 0;
    state.wheelSpeed = 0;
    hideHint();
  }
});

freqEl.addEventListener('input', () => {
  state.acFreq = parseFloat(freqEl.value);
  freqValEl.textContent = state.acFreq.toFixed(1) + ' Hz';
});

showParticlesEl.addEventListener('change', () => {
  state.showParticles = showParticlesEl.checked;
  if (state.showParticles) initParticles();
});

showCircuitEl.addEventListener('change', () => {
  state.showCircuit = showCircuitEl.checked;
});

showValuesEl.addEventListener('change', () => {
  state.showValues = showValuesEl.checked;
});

tankCapEl.addEventListener('input', () => {
  const v = parseFloat(tankCapEl.value);
  state.tankCapacity = Math.pow(10, v - 1);
  const cap = state.tankCapacity;
  capValEl.textContent = cap < 10 ? cap.toFixed(1) + '×' : Math.round(cap) + '×';
});

pumpModeEl.addEventListener('change', () => {
  state.pumpActive = pumpModeEl.checked;
  if (state.pumpActive) {
    // Reset water to 50/50 when pump activates
    state.leftWater = 0.5;
    state.rightWater = 0.5;
  }
});

resetBtn.addEventListener('click', () => {
  state.leftY = 40;
  state.rightY = 105;
  state.leftWater = 0.5;
  state.rightWater = 0.5;
  state.wheelAngle = 0;
  state.wheelSpeed = 0;
  state.flowRate = 0;
  state.acPhase = 0;
  state.time = 0;
  state.acMode = false;
  state.tankCapacity = 1;
  state.pumpActive = false;
  acModeEl.checked = false;
  pumpModeEl.checked = false;
  tankCapEl.value = '1';
  capValEl.textContent = '1×';
  freqRowEl.classList.remove('active');
  initParticles();
});

// ═══════════════════════════════════════════════════
// Main loop
// ═══════════════════════════════════════════════════
let lastTime = 0;
function loop(ts) {
  const dt = lastTime ? Math.min((ts - lastTime) / 1000, 0.05) : 0.016;
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
